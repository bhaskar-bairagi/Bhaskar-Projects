name: Document summarization lab
on:
  push:
    paths: ["nlp-projects/document-summarization-lab/**", ".github/workflows/document-summarization-lab.yml"]
  pull_request:
    paths: ["nlp-projects/document-summarization-lab/**", ".github/workflows/document-summarization-lab.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s nlp-projects/document-summarization-lab -p 'test_*.py'
