name: Pipeline operations workbench
on:
  push:
    paths: ["agent-projects/pipeline-ops-agent/**", ".github/workflows/pipeline-ops-agent.yml"]
  pull_request:
    paths: ["agent-projects/pipeline-ops-agent/**", ".github/workflows/pipeline-ops-agent.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s agent-projects/pipeline-ops-agent -p 'test_*.py'
